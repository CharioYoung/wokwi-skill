<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Microduck · 器件接线图</title>
<style>
  :root {
    --bg: #0a0d11;
    --panel: rgba(17, 21, 27, 0.9);
    --line: rgba(255, 255, 255, 0.08);
    --text: #e6eaef;
    --dim: #838b97;
    --cyan: #4fd8ff;
    --cyan-soft: rgba(79, 216, 255, 0.13);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei",
      "Helvetica Neue", Arial, sans-serif;
    color: var(--text); -webkit-font-smoothing: antialiased;
  }

  /* 图纸本身铺满，界面浮在上面 —— 和外观图一样，图是主角 */
  #stage { position: fixed; inset: 0; }
  #stage::before {
    content: ""; position: absolute; inset: 0;
    background: radial-gradient(120% 90% at 50% 0%, #141b23 0%, #0b0f14 55%, #080a0d 100%);
  }
  #stage svg { position: relative; display: block; width: 100%; height: 100%; cursor: grab; }
  #stage svg:active { cursor: grabbing; }

  /* 高亮 / 压暗：只调透明度，不改几何，读者不会以为图变了 */
  svg .wire { transition: opacity .14s ease, stroke-width .14s ease; }
  svg .wire.hl { opacity: 1; stroke-width: 2.8; }
  svg .wire.dim { opacity: 0.07; }
  svg.no-dim .wire.dim { opacity: 0.5; }
  svg .dev, svg .conn, svg .pin { transition: opacity .14s ease; }
  svg .dev.dim, svg .conn.dim { opacity: 0.32; }
  svg .conn.hl { filter: drop-shadow(0 0 5px rgba(79,216,255,0.85)); }
  svg .pin.hl { stroke: #ffffff; stroke-width: 1.2; }
  svg .pinnums { pointer-events: none; }

  header {
    position: fixed; top: 0; left: 0; right: 0; padding: 18px 24px 0;
    display: flex; align-items: flex-start; gap: 14px; pointer-events: none; z-index: 6;
  }
  .brand h1 { margin: 0; font-size: 16.5px; font-weight: 650; letter-spacing: 0.02em; }
  .brand h1 em { font-style: normal; color: var(--cyan); }
  .brand p { margin: 5px 0 0; font-size: 11px; color: var(--dim); letter-spacing: 0.04em; }
  #stat {
    margin-left: auto; font-size: 10.5px; color: var(--dim);
    background: rgba(12,16,21,0.72); border: 1px solid var(--line);
    border-radius: 999px; padding: 5px 11px; font-variant-numeric: tabular-nums;
    pointer-events: auto; max-width: 44vw; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .back {
    pointer-events: auto; font-size: 11px; color: var(--dim); text-decoration: none;
    border: 1px solid var(--line); border-radius: 999px; padding: 5px 11px;
  }
  .back:hover { color: var(--text); border-color: rgba(255,255,255,0.2); }

  #panel {
    position: fixed; top: 88px; left: 20px; width: 214px;
    background: var(--panel); backdrop-filter: blur(14px);
    border: 1px solid var(--line); border-radius: 13px; padding: 12px;
    display: flex; flex-direction: column; gap: 12px; z-index: 6;
    max-height: calc(100vh - 220px); overflow-y: auto;
  }
  #panel::-webkit-scrollbar { width: 5px; }
  #panel::-webkit-scrollbar-thumb { background: #2a323c; border-radius: 3px; }
  .lbl { font-size: 9.5px; letter-spacing: 0.16em; color: #626a76; text-transform: uppercase; margin-bottom: 7px; }
  .row { display: flex; gap: 5px; flex-wrap: wrap; }
  button {
    font: inherit; font-size: 11px; color: var(--text); cursor: pointer;
    background: rgba(255,255,255,0.04); border: 1px solid var(--line);
    border-radius: 7px; padding: 6px 8px; flex: 1 1 auto; min-width: 52px;
    transition: background .15s, border-color .15s, color .15s;
  }
  button:hover { background: rgba(255,255,255,0.08); }
  button.on { background: var(--cyan-soft); border-color: rgba(79,216,255,0.5); color: #b6ecff; }

  #legend { display: flex; flex-direction: column; gap: 4px; }
  .lg {
    display: grid; grid-template-columns: 10px 1fr auto; align-items: center; gap: 7px;
    text-align: left; padding: 5px 6px; border-radius: 6px; border: 1px solid transparent;
    background: transparent;
  }
  .lg:hover { background: rgba(255,255,255,0.05); }
  .lg.on { border-color: rgba(79,216,255,0.45); background: rgba(79,216,255,0.08); }
  .lg i { width: 10px; height: 3px; border-radius: 2px; display: block; }
  .lg b { font-size: 10.5px; font-weight: 500; }
  .lg s { text-decoration: none; font-size: 9px; color: #6d7580; font-variant-numeric: tabular-nums; }

  #side {
    position: fixed; top: 88px; right: 20px; width: 300px; bottom: 122px;
    background: var(--panel); backdrop-filter: blur(14px);
    border: 1px solid var(--line); border-radius: 13px; z-index: 6;
    display: flex; flex-direction: column; overflow: hidden;
  }
  #side .tabs { display: flex; border-bottom: 1px solid var(--line); flex: 0 0 auto; }
  #side .tabs button {
    border: 0; border-radius: 0; background: transparent; padding: 9px 0; font-size: 11px; color: var(--dim);
  }
  #side .tabs button.on { color: var(--cyan); background: rgba(79,216,255,0.06); }
  .pane { display: flex; flex-direction: column; flex: 1 1 auto; min-height: 0; }
  .pane-head {
    padding: 9px 12px 7px; font-size: 11px; color: var(--text);
    border-bottom: 1px solid var(--line); display: flex; align-items: baseline; gap: 7px; flex: 0 0 auto;
  }
  .pane-head s { text-decoration: none; color: #6d7580; font-size: 9.5px; }
  .scroll { overflow-y: auto; flex: 1 1 auto; min-height: 0; }
  .scroll::-webkit-scrollbar { width: 5px; }
  .scroll::-webkit-scrollbar-thumb { background: #2a323c; border-radius: 3px; }

  table { width: 100%; border-collapse: collapse; font-size: 10.5px; }
  th {
    text-align: left; font-weight: 500; color: #6d7580; font-size: 9.5px;
    padding: 5px 8px; border-bottom: 1px solid var(--line); position: sticky; top: 0;
    background: #12161c; letter-spacing: 0.04em;
  }
  td { padding: 4px 8px; border-bottom: 1px solid rgba(255,255,255,0.03); font-variant-numeric: tabular-nums; }
  td.n { color: var(--cyan); width: 26px; }
  td.dim, s { color: #6d7580; text-decoration: none; }
  tr.on td { background: rgba(79,216,255,0.1); }
  tbody tr[data-pin-net] { cursor: pointer; }
  tbody tr[data-pin-net]:hover td { background: rgba(79,216,255,0.06); }
  tbody tr[data-pin-net].on td { background: rgba(79,216,255,0.13); }
  .empty { padding: 24px 14px; font-size: 11px; color: #5f6773; line-height: 1.8; }

  #netInfo {
    display: none; padding: 10px 12px; border-top: 1px solid var(--line); flex: 0 0 auto;
    font-size: 10.5px; line-height: 1.7;
  }
  #netInfo b { color: var(--cyan); font-size: 12px; }
  #netInfo i { display: block; font-style: normal; color: #7d8794; font-size: 9.5px; margin: 2px 0 6px; }
  #netInfo .chip {
    display: inline-block; margin: 2px 4px 0 0; padding: 1px 6px; cursor: pointer;
    border: 1px solid rgba(79,216,255,0.34); border-radius: 4px; color: #b6ecff; font-size: 9.5px;
  }
  #netInfo .chip:hover { background: rgba(79,216,255,0.14); }

  #net {
    position: fixed; left: 20px; right: 336px; bottom: 18px; height: 92px;
    background: var(--panel); backdrop-filter: blur(14px);
    border: 1px solid var(--line); border-radius: 12px; z-index: 6;
    display: flex; flex-direction: column; overflow: hidden;
  }
  #net .hd {
    display: flex; align-items: center; gap: 9px; padding: 6px 12px;
    border-bottom: 1px solid var(--line); flex: 0 0 auto;
  }
  #net .hd b { font-size: 11px; font-weight: 550; }
  #net .hd span { font-size: 9.5px; color: #6d7580; }
  #netFilter {
    margin-left: auto; width: 140px; font: inherit; font-size: 10.5px; color: var(--text);
    background: rgba(255,255,255,0.05); border: 1px solid var(--line); border-radius: 6px;
    padding: 3px 7px; outline: none;
  }
  #netTable { overflow-y: auto; font-size: 10px; }
  #netTable::-webkit-scrollbar { width: 5px; }
  #netTable::-webkit-scrollbar-thumb { background: #2a323c; border-radius: 3px; }
  .nt-head, .nt-row {
    display: grid; grid-template-columns: 1.6fr 0.55fr 0.7fr 0.7fr 0.3fr;
    gap: 8px; padding: 3px 12px; align-items: center;
  }
  .nt-head { color: #626a76; font-size: 9px; letter-spacing: 0.06em; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: #12161c; }
  .nt-row { border-bottom: 1px solid rgba(255,255,255,0.026); cursor: pointer; font-variant-numeric: tabular-nums; }
  .nt-row:hover { background: rgba(79,216,255,0.08); }
  .nt-row .nm s { color: #6d7580; }

  #tip {
    position: fixed; display: none; z-index: 9; pointer-events: none;
    background: rgba(10,14,19,0.95); border: 1px solid rgba(79,216,255,0.32);
    border-radius: 7px; padding: 6px 9px; font-size: 10.5px; line-height: 1.45;
    max-width: 250px; box-shadow: 0 10px 26px rgba(0,0,0,0.5);
  }
  #tip b { color: var(--cyan); }
  #tip i { display: block; font-style: normal; color: #7d8794; font-size: 9.5px; margin-top: 2px; }

  #boot {
    position: fixed; inset: 0; display: grid; place-items: center;
    background: var(--bg); z-index: 30; transition: opacity .45s;
    font-size: 12px; color: var(--dim); letter-spacing: 0.1em;
  }
  #boot.hide { opacity: 0; pointer-events: none; }
  #boot .bar { width: 140px; height: 2px; background: #1d242c; margin-top: 14px; overflow: hidden; border-radius: 2px; }
  #boot .bar i { display: block; height: 100%; width: 40%; background: var(--cyan); animation: slide 1.1s infinite ease-in-out; }
  @keyframes slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(350%); } }
  .fail { max-width: 460px; line-height: 1.9; color: #d8b48a; font-size: 12px; }
  .fail code { background: #1b2027; padding: 2px 6px; border-radius: 4px; color: #9ed0ff; }
</style>
</head>
<body>
<div id="stage"></div>

<header>
  <div class="brand">
    <h1>Microduck <em>·</em> 器件接线图</h1>
    <p>板子摊开画 · 插座与针脚按实物 · 15 个舵机 · 逐脚网表</p>
  </div>
  <div id="stat">正在布线…</div>
  <a class="back" href="./shell.html">外观 / 3D 打印 →</a>
</header>

<div id="panel">
  <div>
    <div class="lbl">总线</div>
    <div id="legend"></div>
  </div>
  <div>
    <div class="lbl">视图</div>
    <div class="row">
      <button id="btnFit">全图</button>
      <button id="btnZoomIn">放大</button>
      <button id="btnZoomOut">缩小</button>
    </div>
    <div class="row" style="margin-top: 5px">
      <button id="btnNums">脚号</button>
      <button id="btnDim" class="on">压暗</button>
    </div>
  </div>
  <div style="font-size: 10px; color: #5f6773; line-height: 1.8">
    拖拽平移 · 滚轮缩放 · 双击回全图<br />
    点插座看引脚 · 点线看两端<br />
    点总线色条只留那一路
  </div>
</div>

<div id="side">
  <div class="tabs">
    <button id="tDev" class="on">引脚</button>
    <button id="tBom">BOM</button>
  </div>
  <div class="pane" id="paneDev">
    <div class="pane-head" id="pinHead">引脚表</div>
    <div class="scroll" id="pinBody"></div>
    <div id="netInfo"></div>
  </div>
  <div class="pane" id="paneBom" style="display:none">
    <div class="pane-head">BOM <s>型号 / 数量 / 引脚 / 插座</s></div>
    <div class="scroll">
      <table>
        <thead><tr><th>器件</th><th>数量</th><th>脚</th><th>插座</th></tr></thead>
        <tbody id="bomBody"></tbody>
      </table>
    </div>
  </div>
</div>

<div id="net">
  <div class="hd">
    <b>逐脚网表</b><span>点一行在图上高亮</span><s id="netCount"></s>
    <input id="netFilter" placeholder="过滤：I2C / SIG / CAM…" />
  </div>
  <div id="netTable"></div>
</div>

<div id="tip"></div>

<div id="boot">
  <div style="text-align:center">
    <div>正在摆放器件与布线…</div>
    <div class="bar"><i></i></div>
  </div>
</div>

<script type="module" src="./src/internals.js"></script>
<script>
  setTimeout(function () {
    if (window.__MD_OK) return;
    var boot = document.getElementById('boot');
    boot.classList.remove('hide');
    boot.innerHTML = '<div class="fail">' +
      '<b>需要用本地 HTTP 打开。</b><br><br>' +
      '浏览器的 ES 模块在 <code>file://</code> 下会被拦截。<br><br>' +
      '在仓库根目录执行：<br><code>node microduck/serve.mjs</code><br><br>' +
      '然后打开 <code>http://localhost:8099/internals.html</code>。' +
      '</div>';
  }, 3000);
</script>
</body>
</html>
